# pnpm-workspace.yaml — pnpm settings for this single-package repo.
# allowBuilds: native/engine packages that must run install scripts
# (argon2 native binding, Prisma engines, esbuild for tsx, unrs-resolver for eslint).
allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  argon2: true
  esbuild: true
  prisma: true
  unrs-resolver: true
