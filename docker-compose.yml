# docker-compose.yml
# Local development only: starts PostgreSQL on localhost:${POSTGRES_PORT:-5432}.
# Production uses docker-compose.prod.yml (app, migrations, Caddy HTTPS, backups; database not exposed).
#
# Usage: docker compose up -d

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-uscc_dev}
      POSTGRES_USER: ${POSTGRES_USER:-uscc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-uscc}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
